# Render Blueprint (New → Blueprint): databas, backend med analys och frontend. Se DRIFT.md.
# Värden med sync: false frågar Render efter när Blueprinten skapas – de hamnar aldrig i repot.

databases:
  - name: fdata-db
    plan: basic-256mb          # gratisdatabasen raderas efter 30 dagar
    region: frankfurt
    databaseName: fdata
    user: fdata_user
    postgresMajorVersion: "16"  # PostGIS aktiveras av backend vid start (CREATE EXTENSION postgis)

services:
  # Backend (Express) + analysen (Python, analysis/) i samma Docker-tjänst
  - type: web
    name: fdata-backend
    runtime: docker
    plan: starter               # somnar inte; fullanalysen behöver att tjänsten är vaken i upp till 15 min
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fdata-db
          property: connectionString
      # Frontendens adress, t.ex. https://fdata-frontend.onrender.com (värdnamnet räcker)
      - key: FRONTEND_URL
        sync: false
      # Analysen
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TRAFIKLAB_API_KEY
        sync: false
      - key: LANTMATERIET_API_KEY
        sync: false
      - key: LANTMATERIET_API_SECRET
        sync: false
      # Backendens Lantmäteri-API:er (fastighetsgränser och sök på beteckning)
      - key: LM_CONSUMER_KEY
        sync: false
      - key: LM_CONSUMER_SECRET
        sync: false
      - key: REGBET_CONSUMER_KEY
        sync: false
      - key: REGBET_CONSUMER_SECRET
        sync: false

  # Frontend (Vite/React) som statisk sida
  - type: web
    name: fdata-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backendens adress, t.ex. https://fdata-backend.onrender.com (/api läggs på automatiskt)
      - key: VITE_API_URL
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
