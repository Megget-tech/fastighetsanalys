# Render Blueprint (New → Blueprint): databas + appen i en Docker-tjänst. Se DRIFT.md.
# Värden med sync: false frågar Render efter när Blueprinten skapas – de hamnar aldrig i repot.

databases:
  - name: fdata-db
    plan: basic-256mb          # gratisdatabasen raderas efter 30 dagar
    region: frankfurt
    databaseName: fdata
    user: fdata_user
    postgresMajorVersion: "16"  # PostGIS aktiveras av backend vid start (CREATE EXTENSION postgis)

services:
  # Frontend + API + analysen (Python, analysis/) i samma Docker-tjänst, bakom inloggning
  - type: web
    name: fastighetsanalys
    runtime: docker
    plan: starter               # somnar inte; fullanalysen behöver att tjänsten är vaken i upp till 15 min
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fdata-db
          property: connectionString
      # Inloggning (HTTP Basic). Utan dessa vägrar tjänsten alla anrop.
      - key: FDATA_ANVANDARE
        sync: false
      - key: FDATA_LOSENORD
        sync: false
      # Kartan
      - key: MAPBOX_TOKEN
        sync: false
      # Analysen
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TRAFIKLAB_API_KEY
        sync: false
      - key: LANTMATERIET_API_KEY
        sync: false
      - key: LANTMATERIET_API_SECRET
        sync: false
      # Backendens Lantmäteri-API:er (fastighetsgränser och sök på beteckning)
      - key: LM_CONSUMER_KEY
        sync: false
      - key: LM_CONSUMER_SECRET
        sync: false
      - key: REGBET_CONSUMER_KEY
        sync: false
      - key: REGBET_CONSUMER_SECRET
        sync: false
